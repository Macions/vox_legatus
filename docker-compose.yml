version: "3.8"

services:
  # ═══════════════ STARY SYSTEM ═══════════════
  backend:
    build: ./vox_legatus
    container_name: vox-legatus-backend
    expose:
      - "8000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: vox-legatus-db
    restart: always
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: legatus
      POSTGRES_DB: vox_legatus_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ═══════════════ NOWY SYSTEM ═══════════════
  new-backend:
    build:
      context: ../mparlament-backend
      args:
        FRONTEND_SLUG: Macions/mparlament
        FRONTEND_REF: main
    container_name: mparlament-backend
    expose:
      - "4000"
    environment:
      MPARLAMENT_PUBLIC_ORIGIN: https://parlamentmlodych.pl
      MPARLAMENT_JWT_SECRET: oEanhNDikecv01ZVJwL95UPAIQtWl7TGRqpKfubgHr8xdBs3jzSC6y2mFXMYO4
      MPARLAMENT_SEED_ON_START: "true"
    volumes:
      - mparlament-data:/app/data
      - mparlament-uploads:/app/uploads
    restart: unless-stopped

  # ═══════════════ NGINX ═══════════════
  nginx:
    image: nginx:stable
    container_name: vox-legatus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certbot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    depends_on:
      - backend
      - new-backend

  # ═══════════════ CERTBOT ═══════════════
  certbot:
    image: certbot/certbot
    container_name: vox-legatus-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot

volumes:
  pgdata:
  certbot-etc:
  mparlament-data:
  mparlament-uploads: