server {
    listen 80;
    server_name parlamentmlodych.pl www.parlamentmlodych.pl;
    client_max_body_size 50M;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name parlamentmlodych.pl www.parlamentmlodych.pl;
    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/parlamentmlodych.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parlamentmlodych.pl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ═══════════════ NOWY SYSTEM (PRZED location /) ═══════════════
    location /uploads/ {
        alias /var/www/uploads/;
        try_files $uri =404;
    }

    location /newapp/api/ {
        rewrite ^/newapp/api/(.*)$ /api/$1 break;
        proxy_pass http://new-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /newapp/socket.io/ {
        proxy_pass http://new-backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /newapp/ {
        proxy_pass http://new-backend:4000/newapp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════ STARY SYSTEM ═══════════════

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}